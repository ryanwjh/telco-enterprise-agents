# Copy to prod.yaml and fill in real values before deploying. prod.yaml is gitignored (like .env)
# since it holds live, deployment-specific identifiers (service account email, Agent Engine
# resource name, staging bucket, Agentspace app id) — not secrets, but environment fingerprints
# that shouldn't be committed. See docs/superpowers/specs/2026-07-25-retail-merchandising-adk-agents-design.md
# section 7 (local-only doc, gitignored, not on a fresh clone).
environment: prod
# "<domain display_name>: <agent display name>" per _shared/table_registry.yaml's domains: entry
# for this agent's domain -- e.g. "Merchandising: Assortment Planning". Used as the
# --display_name (adk deploy agent_engine) / --display-name (agents-cli publish
# gemini-enterprise) value at deploy time; see _shared/README.md.
display_name: REPLACE_WITH_DOMAIN_DISPLAY_NAME_COLON_AGENT_DISPLAY_NAME
gcp_project_id: REPLACE_WITH_PROD_PROJECT_ID
region: us-central1
service_account: REPLACE_WITH_PROD_SERVICE_ACCOUNT_EMAIL
staging_bucket: REPLACE_WITH_PROD_STAGING_BUCKET
bigquery:
  compute_project_id: REPLACE_WITH_PROD_PROJECT_ID
  location: US
agent_engine_resource_name: null
agentspace:
  app_id: REPLACE_WITH_AGENTSPACE_APP_ID
  registered_agent_id: null
